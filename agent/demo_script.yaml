title: "ScamShield AI"
pitch: "Describe any payment request in plain language and get an instant scam risk verdict before you send."
intro: "ScamShield AI uses Strands Decider to classify payment transactions as Low Risk, High Risk, or Needs Review."
outro: "ScamShield AI: fast, calibrated payment scam detection powered by Strands Decider and Amazon Bedrock."

features:
  - "Instant risk verdict from a plain-language transaction description"
  - "Three calibrated risk signals: unknown recipient, urgency pressure, unusual payment"
  - "Needs Review cases ask a follow-up question instead of guessing"
  - "Tailored safety tips for each flag type"

turns:
  - say: "I received a payment request from an unknown person asking me to transfer Rs.15,000 urgently."
    narrate: "A classic high-risk scenario: unknown recipient combined with urgency pressure."

  - say: "Someone claiming to be from the Income Tax department said I owe Rs.50,000 and must pay right now or face arrest."
    narrate: "An impersonation scam with maximum pressure -- all three risk signals fire."

  - say: "A work-from-home recruiter I found online is asking for a Rs.500 registration fee before my first task."
    narrate: "A borderline case -- one risk signal present, triggering a Needs Review verdict."

  - say: "My friend Priya asked me to pay her Rs.500 for lunch via UPI, she is a saved contact."
    narrate: "A normal low-risk payment between known contacts."
